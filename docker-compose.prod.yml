# ============================================================
# Production Docker Compose for dianyssa-agent
#
# Uses:
#   - GHCR image (ghcr.io/ferilee/dianyssa)
#   - Nginx Proxy Manager pada network Docker bersama (`ferileenet`)
#   - SQLite persisted pada bind mount host `/srv/data/dianyssa/sqlite`
#
# Before first deploy:
#   1. docker network create ferileenet
#   2. cp .env.production.example .env.production
#   3. Fill .env.production with real secrets and an explicit IMAGE_TAG
#   4. Configure an Nginx Proxy Manager Proxy Host to dianyssa-agent:3000
#   5. docker compose -f docker-compose.prod.yml up -d --pull never
# ============================================================

services:
  app:
    image: ghcr.io/ferilee/dianyssa:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    container_name: dianyssa-agent
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL di-load dari .env.production (lihat template
      # .env.production.example) agar single source of truth.
    volumes:
      - /srv/data/dianyssa/sqlite:/app/data
    networks:
      - ferileenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ferileenet:
    external: true
